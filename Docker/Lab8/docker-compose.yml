name: lab8-node-mysql
services:
  app:
    build: ./src
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=ivolve
    volumes:
      - app-logs:/app/logs/
    networks:
      - ivolve-net

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=ivolve
      - MYSQL_USER=ivolve_user
      - MYSQL_PASSWORD=ivolve_pass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ivolve-net

networks:
  ivolve-net:
    driver: bridge

volumes:
  db_data:
    driver: local
  app-logs:
    driver: local