apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivolve-app
  namespace: ivolve
  labels:
    app: ivolve-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ivolve-app
  template:
    metadata:
      labels:
        app: ivolve-app
    spec:
      nodeSelector:
        project: ivolve
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: ivolve-app
          effect: NoSchedule
      initContainers:
        - name: init-db
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h ivolve-db-svc -P 3306 --silent; do
                echo "Waiting for database..."
                sleep 2
              done
              mysql -h ivolve-db-svc -u root -p"$MYSQL_ROOT_PASSWORD" -e "
                CREATE DATABASE IF NOT EXISTS ivolve;
                CREATE USER IF NOT EXISTS 'ivolve'@'%' IDENTIFIED BY 'password';
                GRANT ALL PRIVILEGES ON ivolve.* TO 'ivolve'@'%';
                FLUSH PRIVILEGES;
              "
          envFrom:
            - secretRef:
                name: ivolve-secret
      containers:
        - name: ivolve-app
          image: hazem7777/nodejs-docker-exercise:prod
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ivolve-cm
            - secretRef:
                name: ivolve-secret
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: app-logs
          persistentVolumeClaim:
            claimName: ivolve-pvc