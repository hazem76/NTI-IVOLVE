---
- name: Test AWS Dynamic Inventory
  hosts: tag_server_ivolve
  become: yes
  gather_facts: yes

  tasks:
    - name: Display discovered host information
      debug:
        msg: "Host: {{ inventory_hostname }} | Instance: {{ ec2_instance_id }} | Type: {{ ec2_instance_type }} | Region: {{ ec2_placement_region }} | IP: {{ ec2_public_ip_address | default(ec2_private_ip_address) }}"

    - name: Verify connectivity
      ping:

    - name: Check system uptime
      shell: uptime
      register: uptime_output

    - name: Display uptime
      debug:
        msg: "{{ uptime_output.stdout }}"

    - name: Install Docker if not present
      apt:
        name: docker.io
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes